<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sari-Sari Store</title>
</head>
<body>
    <header>
        <h1>Sari-Sari Store Inventory Management</h1>
    </header>

    <main>
        <section>
            <h2>Welcome to the Sari-Sari Store Inventory Management System</h2>
            <form id="add-product-form">
                <div-class="form-group">
                    <label for="product-name">Product Name:</label>
                    <input type="text" id="product-name" name="product-name" required>
                </div>

                <div-class="form-group">
                    <label for="product-price">Price (PHP): </label>
                    <input type="number" id="product-price" name="product-price" step="0.01" min="0" required>
                </div>

                <div-class="form-group">
                    <label for="product-stock">Initial Stock:</label>
                    <input type="number" id="product-stock" name="product-stock" min="0" required>
                </div>
                
                <button type="submit" id="add-item-btn">Add Product</button>

            </form>
        </section> 

        <hr>

        <section id="Inventory-list-section">
            <h2>Current Inventory</h2>

            <div id="search-bar" class="form-group">
                <label for="search-input">Search Item:</label>
                <input type="text" id="search-input" placeholder="Enter product name...">
            </div>

            <table id="Inventory-table">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Price (PHP)</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4" style="text-align: center; font-style: italic; color: gray;">
                            No items in inventory. Add one above!
                        </td>
                    </tr>
                    <!-- Inventory items will be dynamically added here -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Coco, Labadia, Rollorata Sari-Sari Inventory App</p>
    </footer>
    
</body>
</html>
